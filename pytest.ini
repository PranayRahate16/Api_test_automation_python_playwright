[pytest]

; ---- Test discovery ----
testpaths = testcases

python_files = Test_*.py test_*.py *_test.py
python_classes = Test* *Test *Tests
python_functions = test_*

; ---- Default CLI options ----
addopts =
    -v
    -s
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
    --clean-alluredir

; ---- Custom markers ----
markers =
    smoke: quick sanity checks
    regression: full regression suite
    api: API-layer tests

; ---- Logging ----
log_cli = true
log_cli_level = INFO

; ---- Warnings ----
filterwarnings =
    ignore::DeprecationWarning