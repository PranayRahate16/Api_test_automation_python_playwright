[pytest]

; ---- Test discovery ----
; Where pytest looks for tests
testpaths = testcases

; File name patterns pytest treats as test modules
; Covers both styles used in this project: Test_get_all_products.py and test_client_authorization.py
python_files = Test_*.py test_*.py *_test.py

; Class name patterns pytest treats as test classes
python_classes = Test* *Test *Tests

; Function/method name patterns pytest treats as test cases
python_functions = test_*

; ---- Default CLI options ----
; -v            verbose output (full test names)
; -s            disable output capturing (see print() statements live)
; --strict-markers   fail if an unregistered @pytest.mark.xxx is used (catches typos)
; --tb=short    shorter, more readable tracebacks
addopts =
    -v
    -s
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html

; ---- Custom markers (register any you use with @pytest.mark.name) ----
markers =
    smoke: quick sanity checks
    regression: full regression suite
    api: API-layer tests

; ---- Logging (shows log output inline with -s) ----
log_cli = true
log_cli_level = INFO

; ---- Warnings ----
filterwarnings =
    ignore::DeprecationWarning