name: API Test Automation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Determine test marker
        id: marker
        run: |
          SCOPE="${{ github.event.inputs.test_scope || 'all' }}"
          if [ "$SCOPE" = "smoke" ]; then
            echo "marker=-m smoke" >> $GITHUB_OUTPUT
          elif [ "$SCOPE" = "regression" ]; then
            echo "marker=-m regression" >> $GITHUB_OUTPUT
          else
            echo "marker=" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        run: pytest ${{ steps.marker.outputs.marker }} --junitxml=reports/junit.xml

      - name: Generate Allure report
        if: always()
        run: |
          curl -o allure.zip -Ls https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip -q allure.zip -d /opt
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/local/bin/allure
          allure generate allure-results -o allure-report --clean

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit.xml